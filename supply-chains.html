function textEl(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
maps.forEach(m=>{const a=textEl('a',m.name);a.href='#'+m.id;a.dataset.map=m.id;$('nav').append(a);});
function details(title,edges){$('#detailTitle').textContent=title;$('#detailBody').replaceChildren();edges.forEach(e=>{const block=textEl('section','','detail');const a=active.nodes.find(n=>n.id===e.a),b=active.nodes.find(n=>n.id===e.b);const h=textEl('h3',a.label+' → '+b.label);h.append(textEl('span',states[e.status],'state'));block.append(h,textEl('p',e.title+' — '+e.body));e.refs.forEach(id=>{const s=sources[id],link=textEl('a',s[0]+' · '+s[1]+' ↗');link.href=s[2];link.target='_blank';link.rel='noopener noreferrer';block.append(link);});$('#detailBody').append(block);});if(!$('#details').open)$('#details').showModal();}
function select(id){selected=id;document.querySelectorAll('[data-node]').forEach(n=>n.classList.toggle('selected',n.dataset.node===id));paint();}
function paint(){document.querySelectorAll('.wire').forEach((p,i)=>{const e=active.edges[i],on=selected&&(e.a===selected||e.b===selected);p.classList.toggle('selected',!!on);p.classList.toggle('dim',!!selected&&!on);});}
function draw(){const box=$('#graph').getBoundingClientRect();if(!box.width)return;const svg=$('.wires');svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);$('#paths').replaceChildren();active.edges.forEach((e,i)=>{const a=$('[data-node="'+e.a+'"]').getBoundingClientRect(),b=$('[data-node="'+e.b+'"]').getBoundingClientRect(),x=a.right-box.left,y=a.top+a.height/2-box.top,xx=b.left-box.left,yy=b.top+b.height/2-box.top,m=(x+xx)/2;let d='M'+x+','+y+' C'+m+','+y+' '+m+','+yy+' '+xx+','+yy;if(active.nodes.find(n=>n.id===e.a).col===active.nodes.find(n=>n.id===e.b).col){const cx=a.left+a.width/2-box.left,ay=a.bottom-box.top,by=b.top-box.top,cy=(ay+by)/2;d='M'+cx+','+ay+' C'+cx+','+cy+' '+cx+','+cy+' '+cx+','+by;}const line=document.createElementNS(NS,'path');line.setAttribute('d',d);line.setAttribute('class','wire '+e.status);line.setAttribute('marker-end','url(#arr)');$('#paths').append(line);const hit=document.createElementNS(NS,'path');hit.setAttribute('d',d);hit.setAttribute('class','hit');hit.addEventListener('click',()=>details(e.title,[e]));$('#paths').append(hit);});paint();}
function render(){active=maps.find(m=>m.id===location.hash.slice(1))||maps[0];selected=null;document.querySelectorAll('[data-map]').forEach(a=>a.setAttribute('aria-current',String(a.dataset.map===active.id)));$('#name').replaceChildren(document.createTextNode(active.name),textEl('span',active.code,'code'),textEl('span',active.tag,'pill'));$('#count').textContent=active.nodes.length+'개 항목 · '+active.edges.length+'개 연결';$('#summary').textContent=active.summary;$('#notes').replaceChildren(...active.notes.map(n=>textEl('span',n)));$('#columns').replaceChildren();for(let col=0;col<4;col++){const c=textEl('div','','column');active.nodes.filter(n=>n.col===col).forEach(n=>{const b=textEl('button',n.label,'node'+(col===1?' hub':''));b.type='button';b.dataset.node=n.id;b.append(textEl('span',n.sub));b.addEventListener('click',()=>{select(n.id);details(n.label,active.edges.filter(e=>e.a===n.id||e.b===n.id));});c.append(b);});$('#columns').append(c);}document.title='Watt Board | '+active.name+' 공급망';requestAnimationFrame(draw);}
$('#close').addEventListener('click',()=>$('#details').close());$('#details').addEventListener('click',e=>{if(e.target===$('#details')){const r=$('#details').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#details').close();}});$('#allSources').addEventListener('click',()=>details(active.name+' · 전체 연결 근거',active.edges));window.addEventListener('hashchange',()=>{if($('#details').open)$('#details').close();render();});new ResizeObserver(draw).observe($('#graph'));render();
})();
</script></body></html>
