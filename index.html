<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watt Board | 엘앤에프</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253a;font-family:system-ui,-apple-system,sans-serif}header{background:white;border-bottom:1px solid #e7ecf1}.top{max-width:1080px;margin:auto;padding:24px 28px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.icon{background:#ffce5c;border-radius:12px;width:34px;height:34px;display:grid;place-items:center;color:#6b4810}.tagline{font-size:12px;color:#8591a1;font-weight:500;margin-left:8px}main{max-width:1080px;margin:60px auto;padding:0 28px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:700;color:#9b7625}h1{font-size:30px;margin:8px 0}p{color:#728195}.card{background:white;border:1px solid #e7ecf1;border-radius:20px;padding:28px;margin-top:28px;box-shadow:0 12px 35px #1e293b08}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}.name{font-size:17px;font-weight:700}.code{font-size:13px;color:#94a0af;margin-left:7px}.price{font-size:32px;font-weight:800;margin:12px 0 3px}.change{font-weight:700}.up{color:#df5f60}.down{color:#4985ca}.periods{display:flex;gap:5px}button{border:0;background:#f4f6fa;color:#6b788b;border-radius:8px;padding:9px 13px;cursor:pointer}button.active{background:#1e293b;color:white}canvas{width:100%;height:340px;display:block;margin-top:22px}.foot{border-top:1px solid #eef1f5;padding-top:15px;color:#8591a1;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.status{font-size:13px;color:#a36e24;min-height:20px} @media(max-width:600px){main{margin:32px auto;padding:0 16px}.card{padding:20px}.tagline{display:none}canvas{height:250px}}
</style></head><body><header><div class="top"><span class="icon">ϟ</span> Watt Board <span class="tagline">ALL ABOUT BATTERIES</span></div></header><main><div class="eyebrow">STOCK CHART</div><h1>엘앤에프 주가</h1><p>엘앤에프의 주가 흐름을 확인하세요.</p><section class="card"><div class="cardhead"><div><div class="name">엘앤에프 <span class="code">066970 · KOSPI</span></div><div id="price" class="price">불러오는 중</div><div id="change" class="change"></div></div><div class="periods"><button data-years="1">1년</button><button data-years="3" class="active">3년</button><button data-years="0">전체</button></div></div><canvas id="chart" aria-label="엘앤에프 일별 주가 차트" role="img"></canvas><div id="status" class="status" role="status"></div><div class="foot"><span id="date">기준일 확인 중</span><span id="source">출처 확인 중</span></div></section></main><script>
let all=[];let years=3;const canvas=document.querySelector('#chart');const fmt=n=>new Intl.NumberFormat('ko-KR').format(Math.round(n));function draw(){if(!all.length)return;const end=new Date(all.at(-1).date+'T00:00:00');let cutoff=new Date(end);cutoff.setFullYear(cutoff.getFullYear()-years);const points=years?all.filter(p=>new Date(p.date+'T00:00:00')>=cutoff):all;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=rect.width,h=rect.height,l=66,r=12,t=18,b=30;let min=Math.min(...points.map(p=>p.close)),max=Math.max(...points.map(p=>p.close));let pad=(max-min)*.1||1;min=Math.max(0,min-pad);max+=pad;c.font='12px system-ui';c.textAlign='right';for(let i=0;i<5;i++){let y=t+(h-t-b)*i/4;c.strokeStyle='#edf0f5';c.beginPath();c.moveTo(l,y);c.lineTo(w-r,y);c.stroke();c.fillStyle='#9aa5b3';c.fillText(fmt(max-(max-min)*i/4),l-8,y+4)}c.strokeStyle='#ff6b6b';c.lineWidth=2.5;c.lineJoin='round';c.beginPath();points.forEach((p,i)=>{let x=l+(w-l-r)*i/Math.max(points.length-1,1),y=t+(h-t-b)*(max-p.close)/(max-min);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle='#9aa5b3';c.textAlign='left';c.fillText(points[0].date,l,h-4);c.textAlign='right';c.fillText(points.at(-1).date,w-r,h-4)}document.querySelectorAll('button[data-years]').forEach(b=>b.onclick=()=>{years=Number(b.dataset.years);document.querySelectorAll('button[data-years]').forEach(x=>x.classList.toggle('active',x===b));draw()});window.addEventListener('resize',draw);fetch('/api/price').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{all=d.points;if(all.length<2)throw Error();const a=all.at(-1),b=all.at(-2),pct=(a.close/b.close-1)*100;document.querySelector('#price').textContent=fmt(a.close)+'원';const el=document.querySelector('#change');el.textContent=(pct>0?'+':'')+pct.toFixed(2)+'%';el.classList.add(pct>=0?'up':'down');document.querySelector('#date').textContent=a.date+' 기준';document.querySelector('#source').textContent='출처: '+d.source;document.querySelector('#status').textContent=d.isSnapshot?'최신 데이터를 불러오지 못해 이전 저장본을 표시합니다.':'일별 주가이며 장중에는 변동 중인 값이 포함될 수 있습니다. 시세가 지연될 수 있습니다.';draw()}).catch(()=>{document.querySelector('#price').textContent='불러올 수 없음';document.querySelector('#status').textContent='주가 데이터를 가져오지 못했습니다. 잠시 후 다시 확인해 주세요.'});
</script></body></html>
